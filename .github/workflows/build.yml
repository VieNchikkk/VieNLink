name: build

# Сборка и быстрые проверки без сети: парсеры, маршрутизация, склейка узлов.
# Живые прогоны (liveness, checkconfigs) требуют скачивания ядра и узлов — их запускают вручную.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Android-клиент собирается отдельным toolchain (workload android + libbox.aar),
      # поэтому CI проверяет Windows-приложение и общий SelfTest.
      - name: Сборка Windows
        run: |
          dotnet build VieNLink/VieNLink.csproj --nologo
          dotnet build VieNLink.SelfTest/VieNLink.SelfTest.csproj --nologo

      - name: Тесты парсеров и конфига
        run: dotnet run --project VieNLink.SelfTest -- parsers
